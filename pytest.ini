[pytest]
testpaths = tests
python_files = test_*.py catasto-test-*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --color=yes --timeout=30
markers =
    slow: marks tests as slow (skipped in CI)
    integration: marks tests as integration tests
    gui: marks tests that require GUI
    unit: marks tests as unit tests
timeout = 30
timeout_method = thread